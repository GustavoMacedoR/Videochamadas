<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Salas - Videochamadas</title>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;padding:12px}
    #rooms{margin-top:12px}
    .room{padding:8px;border:1px solid #ddd;margin:6px 0;display:flex;justify-content:space-between;align-items:center}
    .room button{margin-left:8px}
    form{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    #filterSection{
      margin-top:14px;padding:10px 12px;background:#f5f5f5;
      border:1px solid #ddd;border-radius:6px;display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;
    }
    #filterSection label{font-size:.82em;color:#555;display:flex;flex-direction:column;gap:3px;}
    #filterSection input{
      padding:5px 8px;border:1px solid #ccc;border-radius:4px;font-size:.9em;width:160px;
    }
    #clearFiltersBtn{
      padding:5px 12px;background:#eee;border:1px solid #ccc;border-radius:4px;
      cursor:pointer;font-size:.85em;align-self:flex-end;
    }
    #clearFiltersBtn:hover{background:#ddd;}
    #filterCount{font-size:.82em;color:#666;align-self:flex-end;}
  </style>
</head>
<body>
  <h2>Salas de Videochamada</h2>
  <p>Esta página lista as salas via <strong>/video/api/rooms/</strong>. Ao criar/abrir uma sala, o cliente de chamada será aberto em outra aba.</p>

  <form id="createForm">
    <input id="nameInput" placeholder="Nome da sala (opcional)" />
    <button type="submit">Criar Sala</button>
    <button type="button" id="refreshBtn">Atualizar lista</button>
  </form>

  <div id="filterSection">
    <label>
      Filtrar por nome
      <input id="filterName" type="text" placeholder="ex: Turma A" />
    </label>
    <label>
      Filtrar por identificador
      <input id="filterId" type="text" placeholder="ex: a1b2c3..." />
    </label>
    <label>
      Filtrar por data
      <input id="filterDate" type="date" />
    </label>
    <button type="button" id="clearFiltersBtn">Limpar filtros</button>
    <span id="filterCount"></span>
  </div>

  <div id="rooms">Carregando...</div>

  <script>
    // Ajuste a URL do backend se necessário
    // Sempre use o prefixo /video nas chamadas ao backend
    const ORIGIN = location.origin;
    const PREFIX = '/video';
    const BACKEND_API = (location.protocol === 'file:' ? 'http://127.0.0.1:8000' + PREFIX : (ORIGIN + PREFIX)) + '/api/rooms/';

    const roomsEl = document.getElementById('rooms');
    const createForm = document.getElementById('createForm');
    const nameInput = document.getElementById('nameInput');
    const refreshBtn = document.getElementById('refreshBtn');

    // --- filter helpers ---
    let _filterTimer = null;
    function scheduleReload(delay = 400){
      clearTimeout(_filterTimer);
      _filterTimer = setTimeout(listRooms, delay);
    }

    document.getElementById('filterName').addEventListener('input', () => scheduleReload(400));
    document.getElementById('filterId').addEventListener('input',   () => scheduleReload(400));
    document.getElementById('filterDate').addEventListener('change', () => scheduleReload(0));
    document.getElementById('clearFiltersBtn').onclick = () => {
      document.getElementById('filterName').value = '';
      document.getElementById('filterId').value = '';
      document.getElementById('filterDate').value = '';
      listRooms();
    };

    async function listRooms(){
      roomsEl.textContent = 'Carregando...';
      const nameQ = document.getElementById('filterName').value.trim();
      const idQ   = document.getElementById('filterId').value.trim();
      const dateQ = document.getElementById('filterDate').value;
      const params = new URLSearchParams();
      if(nameQ) params.set('name', nameQ);
      if(idQ)   params.set('id',   idQ);
      if(dateQ) params.set('date', dateQ);
      const url = BACKEND_API + (params.toString() ? '?' + params.toString() : '');
      try{
        const res = await fetch(url, {credentials: 'include'});
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const rooms = await res.json();
        renderList(rooms);
        const hasFilter = nameQ || idQ || dateQ;
        document.getElementById('filterCount').textContent = hasFilter
          ? `Mostrando ${rooms.length} resultado(s)`
          : `Total: ${rooms.length}`;
      }catch(e){
        roomsEl.innerHTML = `<div style="color:#900">Erro ao listar salas: ${e.message}. Veja notas abaixo sobre CORS/servidor.</div>`;
      }
    }

    function renderList(list){
      if(!list || list.length === 0){
        roomsEl.innerHTML = '<i>Nenhuma sala encontrada.</i>';
        return;
      }
      roomsEl.innerHTML = '';
      list.forEach(r => {
        const div = document.createElement('div');
        div.className = 'room';
        const title = document.createElement('div');
        title.textContent = (r.name || r.id) + ' — ' + new Date(r.created_at).toLocaleString();
        const actions = document.createElement('div');
        const openBtn = document.createElement('button');
        openBtn.textContent = 'Abrir';
        openBtn.onclick = () => openRoom(r);
        actions.appendChild(openBtn);
        div.appendChild(title);
        div.appendChild(actions);
        roomsEl.appendChild(div);
      });
    }

    function openRoom(room){
      const identifier = room.id;
      const url = `test_call.html?room=${encodeURIComponent(identifier)}`;
      window.open(url, '_blank');
    }

    createForm.onsubmit = async (ev) => {
      ev.preventDefault();
      const name = nameInput.value.trim();
      try{
        const res = await fetch(BACKEND_API, {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({name: name || ''}),
          credentials: 'include'
        });
        if(!res.ok) throw new Error('HTTP ' + res.status);
        const room = await res.json();
        nameInput.value = '';
        listRooms();
        openRoom(room);
      }catch(e){
        alert('Falha ao criar sala: ' + e.message + '\n\nSe for erro de CORS, sirva este arquivo pelo mesmo host/porta do backend, ou habilite CORS no Django (ex: django-cors-headers).');
      }
    };

    refreshBtn.onclick = listRooms;

    // Notas rápidas sobre CORS/servir arquivos:
    // - Se abrir este arquivo via file:// o fetch pode falhar por restrições do navegador.
    // - Para evitar problemas, sirva a pasta `client/` com o mesmo host que o backend ou habilite CORS no Django.

    // Inicializa
    listRooms();
  </script>
</body>
</html>
