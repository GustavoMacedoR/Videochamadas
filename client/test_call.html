<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Teste Videochamada</title>
  <style>
    video{width:45%;margin:1%;background:#000}
    #chatBox{
      display:none;margin-top:12px;border:1px solid #ccc;border-radius:6px;
      width:100%;max-width:600px;font-family:Arial,Helvetica,sans-serif;
    }
    #chatMessages{
      height:220px;overflow-y:auto;padding:8px;background:#fafafa;
      border-bottom:1px solid #ccc;display:flex;flex-direction:column;gap:4px;
    }
    .chat-msg{padding:4px 8px;border-radius:4px;max-width:85%;word-break:break-word;}
    .chat-msg.mine{background:#d1e7ff;align-self:flex-end;text-align:right;}
    .chat-msg.theirs{background:#e9e9e9;align-self:flex-start;}
    .chat-msg .chat-name{font-size:0.75em;font-weight:bold;color:#555;display:block;margin-bottom:2px;}
    .chat-msg .chat-text{font-size:0.92em;}
    #chatForm{display:flex;gap:6px;padding:6px;}
    #chatInput{flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:4px;font-size:0.9em;}
    #chatSendBtn{padding:6px 12px;background:#0078d4;color:#fff;border:none;border-radius:4px;cursor:pointer;}
    #chatSendBtn:hover{background:#005fa3;}
    #chatNameInput{padding:4px 6px;border:1px solid #ccc;border-radius:4px;font-size:0.85em;width:120px;}
    /* Raise hand */
    #handBox{
      display:none;margin-top:10px;border:1px solid #e8c840;border-radius:6px;
      width:100%;max-width:600px;font-family:Arial,Helvetica,sans-serif;background:#fffdf0;
    }
    #handBoxHeader{
      display:flex;align-items:center;justify-content:space-between;
      padding:6px 10px;border-bottom:1px solid #e8c840;
    }
    #handBoxHeader h4{margin:0;font-size:0.95em;color:#7a6000;}
    #raiseHandBtn{
      padding:5px 14px;border:none;border-radius:4px;cursor:pointer;
      font-size:0.9em;background:#f5c518;color:#333;font-weight:bold;
    }
    #raiseHandBtn.raised{background:#e05c00;color:#fff;}
    #raiseHandBtn:disabled{opacity:.5;cursor:default;}
    #handQueue{list-style:none;margin:0;padding:6px 10px;min-height:32px;}
    #handQueue li{
      padding:4px 8px;margin:3px 0;border-radius:4px;font-size:0.9em;
      background:#fff8d0;border:1px solid #e8c840;display:flex;align-items:center;gap:8px;
    }
    #handQueue li.speaking{background:#d4f5d4;border-color:#4caf50;font-weight:bold;}
    .hand-pos{font-weight:bold;color:#7a6000;min-width:22px;text-align:center;}
    .hand-name{flex:1;}
    .hand-lower-btn{font-size:0.8em;padding:2px 8px;background:#ccc;border:none;border-radius:3px;cursor:pointer;}
    .hand-lower-btn:hover{background:#bbb;}
  </style>
</head>
<body>
  <h3>Teste Videochamada (Django Channels signaling)</h3>
  <div>
    <video id="localVideo" autoplay muted playsinline></video>
    <div id="remoteContainer" style="display:flex;flex-wrap:wrap"></div>
  </div>
  <div>
    <input id="roomInput" placeholder="room" />
    <input id="chatNameInput" placeholder="Seu nome" title="Nome exibido no chat" />
    <button id="connectBtn">Conectar</button>
    <button id="startBtn">Start Call (criar offer)</button>
    <button id="hangupBtn">Hang Up</button>
    <span id="status" style="margin-left:12px;color:#444"></span>
    <div style="margin-top:8px">
      <button id="recordStartBtn" disabled>Iniciar Gravação (Servidor)</button>
      <button id="recordStopBtn" disabled>Parar Gravação (Servidor)</button>
      <span id="recordStatus" style="margin-left:12px;color:#444"></span>
    </div>
  </div>

  <div id="handBox">
    <div id="handBoxHeader">
      <h4>✋ Fila para falar</h4>
      <button id="raiseHandBtn" disabled>✋ Levantar Mão</button>
    </div>
    <ul id="handQueue"><li style="color:#aaa;font-size:.85em;padding:4px 8px">Nenhuma mão levantada.</li></ul>
  </div>

  <div id="chatBox">
    <div id="chatMessages"></div>
    <form id="chatForm" autocomplete="off">
      <input id="chatInput" type="text" placeholder="Digite uma mensagem..." maxlength="1000" />
      <button type="submit" id="chatSendBtn">Enviar</button>
    </form>
  </div>

  <script>
    const localVideo = document.getElementById('localVideo');
    const remoteContainer = document.getElementById('remoteContainer');
    const connectBtn = document.getElementById('connectBtn');
    const startBtn = document.getElementById('startBtn');
    const hangupBtn = document.getElementById('hangupBtn');
    const roomInput = document.getElementById('roomInput');

    // Defaults
    const BACKEND_PORT = 8000; // ajuste se o runserver usar outra porta
    const WS_BASE_PATH = '/ws/calls/'; // changed to avoid conflict with existing /ws/
    // ICE servers: multiple public STUN servers for better NAT traversal (no TURN entries)
    const ICE_SERVERS = [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun2.l.google.com:19302' },
      { urls: 'stun:stun3.l.google.com:19302' },
      { urls: 'stun:stun4.l.google.com:19302' },
      { urls: 'stun:stun.services.mozilla.com' },
      { urls: 'stun:stun.stunprotocol.org:3478' }
    ];
    // Build API base: always call the API under the `/video` prefix.
    const API_ORIGIN = location.origin;
    const API_PREFIX = '/video';
    const BACKEND_API_BASE = (location.protocol === 'file:' ? `http://127.0.0.1:${BACKEND_PORT}${API_PREFIX}` : (API_ORIGIN + API_PREFIX)) + '/api';

    const clientId = Math.random().toString(36).slice(2, 9);
    let localStream;
    let ws;
    let currentRoom = null;
    const peers = {}; // peerId -> {pc, videoEl}
    let roomRecordingActive = false;
    let roomRecordingOwner = '';
    let _recordingPollTimer = null;
    // Chat
    let _chatName = '';
    const _chatMessages = []; // keep a brief in-memory log for the session
    // Raise hand / speak queue
    let _handQueue = [];        // [{clientId, name}] in raise order
    let _myHandRaised = false;

    let __fakeMedia = null; // resources for fake media

    async function initLocalMedia(){
      try{
        localStream = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
        localVideo.srcObject = localStream;
        return;
      }catch(e){
        console.error('getUserMedia failed, using virtual fallback:', e);
        // show a clearer message in the page for debugging
        document.getElementById('status').textContent = 'Local media: unavailable (' + (e.name || '') + ': ' + (e.message || '') + ')';
        // expose permissions state if available
        try{
          if(navigator.permissions){
            navigator.permissions.query({name:'camera'}).then(p => console.info('camera permission state:', p.state)).catch(()=>{});
            navigator.permissions.query({name:'microphone'}).then(p => console.info('microphone permission state:', p.state)).catch(()=>{});
          }
        }catch(_){ }
        localStream = createFakeMediaStream();
        localVideo.srcObject = localStream;
      }
    }

    function createFakeMediaStream(){
      const canvas = document.createElement('canvas');
      canvas.width = 640; canvas.height = 480; canvas.style.display = 'none';
      document.body.appendChild(canvas);
      const ctx = canvas.getContext('2d');

      let t = 0;
      let rafId = null;
      function draw(){
        t += 0.03;
        ctx.fillStyle = '#111'; ctx.fillRect(0,0,canvas.width,canvas.height);
        for(let i=0;i<6;i++){
          const x = (canvas.width/2) + Math.sin(t*(0.5+i*0.2)+i)*140;
          const y = (canvas.height/2) + Math.cos(t*(0.4+i*0.15)+i)*90;
          ctx.beginPath(); ctx.fillStyle = `hsl(${(t*40+i*60)%360},60%,50%)`;
          ctx.arc(x,y,40,0,Math.PI*2); ctx.fill();
        }
        rafId = requestAnimationFrame(draw);
      }
      draw();

      const stream = canvas.captureStream(30);

      // generate a very quiet tone as fake audio
      let audioCtx = null; let osc = null;
      try{
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const dest = audioCtx.createMediaStreamDestination();
        osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = 220;
        const gain = audioCtx.createGain(); gain.gain.value = 0.02;
        osc.connect(gain); gain.connect(dest); osc.start();
        const aTrack = dest.stream.getAudioTracks()[0]; if(aTrack) stream.addTrack(aTrack);
      }catch(e){ console.warn('fake audio not created', e); }

      __fakeMedia = {canvas, rafId, audioCtx, osc};
      return stream;
    }

    function makePeerConnection(peerId){
        const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
        // Log ICE candidates and connection state for debugging P2P vs TURN relay
        pc.onicecandidate = (ev) => {
          if(ev.candidate){
            console.log('ICE candidate generated for', peerId, ev.candidate.candidate);
            if(document.getElementById('status')){
              const s = document.getElementById('status');
              s.textContent = 'ICE: generated candidate for ' + peerId + ' (' + ev.candidate.candidate.slice(0,80) + '...)';
            }
            sendMessage({type:'candidate', candidate: ev.candidate, to: peerId, from: clientId});
          }
        };
        pc.oniceconnectionstatechange = () => {
          console.log('ICE connection state for', peerId, pc.iceConnectionState);
          if(document.getElementById('status')) document.getElementById('status').textContent = 'ICE state: ' + pc.iceConnectionState;
        };
        pc.onconnectionstatechange = () => {
          console.log('Connection state for', peerId, pc.connectionState);
          if(document.getElementById('status')) document.getElementById('status').textContent = 'Connection: ' + pc.connectionState;
        };
        pc.ontrack = (ev) => {
          let info = peers[peerId];
          if(!info) return;
          info.videoEl.srcObject = ev.streams[0];
        };
      if(localStream){
        localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
      }
      // expose a small helper to inspect gathered candidates later
      pc._peerId = peerId;
      return pc;
    }

    function sendMessage(msg){
      if(!ws){ console.warn('sendMessage: no ws'); return; }
      if(!msg.from) msg.from = clientId;
      console.log('sendMessage ->', msg);
      if(ws.readyState !== WebSocket.OPEN){ console.warn('WS not open yet', ws.readyState); return; }
      ws.send(JSON.stringify(msg));
    }

    async function fetchRoomRecordingStatus(room){
      if(!room) return;
      const url = `${BACKEND_API_BASE}/recordings/server/status/?room_name=${encodeURIComponent(room)}`;
      const res = await fetch(url);
      const data = await res.json().catch(() => ({}));
      if(!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
      roomRecordingActive = !!data.is_recording;
      roomRecordingOwner = data.started_by || '';
      if(roomRecordingActive){
        document.getElementById('recordStatus').textContent = `Gravação ativa na sala por ${roomRecordingOwner || 'outro participante'}`;
        document.getElementById('recordStartBtn').disabled = true;
        document.getElementById('recordStopBtn').disabled = false;
      }else{
        document.getElementById('recordStatus').textContent = 'Nenhuma gravação ativa';
        document.getElementById('recordStartBtn').disabled = false;
        document.getElementById('recordStopBtn').disabled = true;
      }
    }

    function startRecordingResultPolling(roomName){
      if(_recordingPollTimer) clearTimeout(_recordingPollTimer);
      const MAX_ATTEMPTS = 20;
      const INTERVAL_MS = 3000;
      let attempts = 0;
      // Store the moment we started polling so we can look for recordings created around that time
      const pollStartTs = Date.now();

      const recordingsListUrl = `${BACKEND_API_BASE}/recordings/`;

      const poll = async () => {
        attempts += 1;
        const remaining = MAX_ATTEMPTS - attempts;
        const secsLeft = remaining * (INTERVAL_MS / 1000);
        try{
          const res = await fetch(recordingsListUrl);
          const list = await res.json().catch(() => ([]));
          if(res.ok && Array.isArray(list) && list.length){
            // Look for any recording created at or after we stopped (with 90s tolerance for clock skew / server delay)
            const cutoff = pollStartTs - 90000;
            const found = list.find(item => {
              if(!item) return false;
              const createdAt = item.created_at ? new Date(item.created_at).getTime() : 0;
              return createdAt >= cutoff;
            });
            if(found){
              const videoLink = found.url
                ? `<a href="${found.url}" target="_blank" rel="noopener">▶ ver gravação</a>`
                : (found.file ? `arquivo: ${found.file}` : 'link de gravação indisponível');
              document.getElementById('recordStatus').innerHTML = `✅ Arquivo pronto! ${videoLink}`;
              return;
            }
          }
        }catch(e){ console.warn('poll error', e); }

        if(attempts < MAX_ATTEMPTS){
          document.getElementById('recordStatus').textContent =
            `⏳ Processando arquivo... (tentativa ${attempts}/${MAX_ATTEMPTS}, ~${secsLeft}s restantes)`;
          _recordingPollTimer = setTimeout(poll, INTERVAL_MS);
        }else{
          // Timeout — show direct link so user can check manually
          document.getElementById('recordStatus').innerHTML =
            `⚠️ Arquivo não detectado automaticamente. ` +
            `<a href="${recordingsListUrl}" target="_blank" rel="noopener">Verificar gravações</a> ` +
            `(pode demorar alguns instantes após o processamento no servidor).`;
        }
      };

      poll();
    }

    connectBtn.onclick = async () => {
      const room = (roomInput.value || new URLSearchParams(location.search).get('room') || 'testroom');
      currentRoom = room;
      await initLocalMedia();

      const protocol = (location.protocol === 'https:') ? 'wss' : 'ws';
      const hostPort = (location.protocol === 'https:') ? location.host : `${location.hostname}:${BACKEND_PORT}`;
      const url = `${protocol}://${hostPort}${WS_BASE_PATH}${encodeURIComponent(room)}/`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        console.log('WS open', url);
        document.getElementById('status').textContent = 'WS: open';
        startBtn.disabled = false;
        fetchRoomRecordingStatus(currentRoom).catch(e => {
          document.getElementById('recordStatus').textContent = 'Falha ao consultar gravação: ' + e.message;
        });
        // enable chat
        _chatName = document.getElementById('chatNameInput').value.trim() || 'Participante';
        document.getElementById('chatBox').style.display = '';
        document.getElementById('chatMessages').innerHTML = '';
        _chatMessages.length = 0;
        // enable hand panel
        _handQueue = [];
        _myHandRaised = false;
        document.getElementById('handBox').style.display = '';
        document.getElementById('raiseHandBtn').disabled = false;
        document.getElementById('raiseHandBtn').textContent = '✋ Levantar Mão';
        document.getElementById('raiseHandBtn').classList.remove('raised');
        renderHandQueue();
        // announce ourselves to the room so existing peers will create offers
        sendMessage({type: 'join', client_id: clientId});
      };
      ws.onclose = () => { console.log('WS closed'); document.getElementById('status').textContent = 'WS: closed'; };
      ws.onerror = (e) => { console.error('WS error', e); document.getElementById('status').textContent = 'WS: error'; };

      // disable start until ws open
      startBtn.disabled = true;
      document.getElementById('status').textContent = 'WS: connecting...';

      ws.onmessage = async (evt) => {
        let data;
        try{ data = JSON.parse(evt.data); }catch(e){ return; }
        console.log('WS msg', data);
        // Ignore messages from ourselves
        if(data.from === clientId) return;

        if(data.type === 'chat'){
          appendChatMessage(data.name || 'Anônimo', data.message || '', false);
          return;
        }

        if(data.type === 'hand_raise'){
          const cid = data.client_id || '';
          if(cid && !_handQueue.find(e => e.clientId === cid)){
            _handQueue.push({clientId: cid, name: data.name || 'Anônimo'});
            renderHandQueue();
          }
          return;
        }

        if(data.type === 'hand_lower'){
          const cid = data.client_id || '';
          _handQueue = _handQueue.filter(e => e.clientId !== cid);
          renderHandQueue();
          return;
        }

        if(data.type === 'join'){
          // a new peer joined (data.client_id)
          const newId = data.client_id;
          if(newId === clientId) return;
          if(peers[newId]) return; // already have
          // create pc and make offer to new peer
          const videoEl = createRemoteVideoEl(newId);
          const pc = makePeerConnection(newId);
          peers[newId] = {pc, videoEl};
          try{
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendMessage({type:'offer', sdp: offer.sdp, to: newId, from: clientId});
          }catch(e){ console.error('Failed to create/send offer to', newId, e); }
        }else if(data.type === 'offer'){
          if(data.to !== clientId) return;
          const fromId = data.from;
          if(!peers[fromId]){
            const videoEl = createRemoteVideoEl(fromId);
            const pc = makePeerConnection(fromId);
            peers[fromId] = {pc, videoEl};
          }
          const pc = peers[fromId].pc;
          await pc.setRemoteDescription({type:'offer', sdp: data.sdp});
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          sendMessage({type:'answer', sdp: answer.sdp, to: fromId, from: clientId});
        }else if(data.type === 'answer'){
          if(data.to !== clientId) return;
          const fromId = data.from;
          const info = peers[fromId];
          if(!info){ console.warn('answer from unknown peer', fromId); return; }
          await info.pc.setRemoteDescription({type:'answer', sdp: data.sdp});
        }else if(data.type === 'candidate'){
          if(data.to !== clientId) return;
          const fromId = data.from;
          const info = peers[fromId];
          if(!info){ console.warn('candidate from unknown peer', fromId); return; }
          try{ await info.pc.addIceCandidate(data.candidate); }catch(e){ console.warn('addIceCandidate failed', e); }
        }else if(data.type === 'recording_started'){
          roomRecordingActive = true;
          roomRecordingOwner = data.started_by || 'outro participante';
          document.getElementById('recordStatus').textContent = `Gravação iniciada por ${roomRecordingOwner}`;
          document.getElementById('recordStartBtn').disabled = true;
          document.getElementById('recordStopBtn').disabled = false;
        }else if(data.type === 'recording_stopped'){
          roomRecordingActive = false;
          roomRecordingOwner = '';
          document.getElementById('recordStatus').textContent = 'Gravação encerrada. Processando arquivo...';
          document.getElementById('recordStartBtn').disabled = false;
          document.getElementById('recordStopBtn').disabled = true;
          if(currentRoom) startRecordingResultPolling(currentRoom);
        }else if(data.type === 'recording_ready'){
          const rec = (data && data.recording) ? data.recording : {};
          if(rec.error){
            document.getElementById('recordStatus').textContent = 'Falha na gravação do servidor: ' + rec.error;
            return;
          }
          const videoLink = rec.url ? `<a href="${rec.url}" target="_blank" rel="noopener">ver gravação</a>` : 'link de gravação indisponível';
          const minutesLink = rec.minutes_url ? `<a href="${rec.minutes_url}" target="_blank" rel="noopener">ver ata</a>` : 'ata ainda em processamento';
          document.getElementById('recordStatus').innerHTML = `Arquivo pronto: ${videoLink} | ${minutesLink}`;
        }
      };
    };

    // Start button is not required for multi-party (offers created automatically on join)
    startBtn.onclick = () => alert('Auto-offer is used for multi-party; simply click Conectar in multiple clients.');

    hangupBtn.onclick = () => {
      if(ws) ws.close();
      // close all peer connections and remove videos
      Object.keys(peers).forEach(id => {
        try{ peers[id].pc.close(); }catch(e){}
        if(peers[id].videoEl && peers[id].videoEl.parentNode) peers[id].videoEl.parentNode.removeChild(peers[id].videoEl);
      });
      Object.keys(peers).forEach(k => delete peers[k]);
      if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream = null; }
      if(__fakeMedia){
        if(__fakeMedia.rafId) cancelAnimationFrame(__fakeMedia.rafId);
        if(__fakeMedia.osc && __fakeMedia.osc.stop) try{ __fakeMedia.osc.stop(); }catch(e){}
        if(__fakeMedia.audioCtx && __fakeMedia.audioCtx.close) __fakeMedia.audioCtx.close();
        if(__fakeMedia.canvas && __fakeMedia.canvas.parentNode) __fakeMedia.canvas.parentNode.removeChild(__fakeMedia.canvas);
        __fakeMedia = null;
      }
      localVideo.srcObject = null;
      // hide and clear chat
      document.getElementById('chatBox').style.display = 'none';
      document.getElementById('chatMessages').innerHTML = '';
      _chatMessages.length = 0;
      // hide and clear hand queue
      document.getElementById('handBox').style.display = 'none';
      document.getElementById('raiseHandBtn').disabled = true;
      _handQueue = [];
      _myHandRaised = false;
      renderHandQueue();
    };

    // Chat helpers
    function appendChatMessage(name, message, isOwn){
      const container = document.getElementById('chatMessages');
      const div = document.createElement('div');
      div.className = 'chat-msg ' + (isOwn ? 'mine' : 'theirs');
      div.innerHTML =
        `<span class="chat-name">${escapeHtml(name)}</span>` +
        `<span class="chat-text">${escapeHtml(message)}</span>`;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      _chatMessages.push({name, message, isOwn, ts: Date.now()});
    }

    function escapeHtml(str){
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // --- Raise hand / speak queue ---
    function renderHandQueue(){
      const ul = document.getElementById('handQueue');
      if(!_handQueue.length){
        ul.innerHTML = '<li style="color:#aaa;font-size:.85em;padding:4px 8px">Nenhuma mão levantada.</li>';
        return;
      }
      ul.innerHTML = '';
      _handQueue.forEach((entry, idx) => {
        const isMe = entry.clientId === clientId;
        const isSpeaking = idx === 0;
        const li = document.createElement('li');
        if(isSpeaking) li.classList.add('speaking');
        const pos = document.createElement('span');
        pos.className = 'hand-pos';
        pos.textContent = isSpeaking ? '🎙️' : `${idx + 1}º`;
        const name = document.createElement('span');
        name.className = 'hand-name';
        name.textContent = escapeHtml(entry.name) + (isSpeaking ? ' — sua vez!' : '');
        li.appendChild(pos);
        li.appendChild(name);
        // show lower button only for own entry
        if(isMe){
          const btn = document.createElement('button');
          btn.className = 'hand-lower-btn';
          btn.textContent = 'Abaixar';
          btn.onclick = () => lowerHand();
          li.appendChild(btn);
        }
        ul.appendChild(li);
      });
    }

    function raiseHand(){
      if(!ws || ws.readyState !== WebSocket.OPEN) return;
      const name = document.getElementById('chatNameInput').value.trim() || _chatName || 'Participante';
      _myHandRaised = true;
      // add own entry locally immediately so it feels instant
      if(!_handQueue.find(e => e.clientId === clientId)){
        _handQueue.push({clientId, name});
        renderHandQueue();
      }
      sendMessage({type: 'raise_hand', client_id: clientId, name});
      const btn = document.getElementById('raiseHandBtn');
      btn.textContent = '✋ Abaixar Mão';
      btn.classList.add('raised');
    }

    function lowerHand(){
      if(!ws || ws.readyState !== WebSocket.OPEN) return;
      _myHandRaised = false;
      _handQueue = _handQueue.filter(e => e.clientId !== clientId);
      renderHandQueue();
      sendMessage({type: 'lower_hand', client_id: clientId});
      const btn = document.getElementById('raiseHandBtn');
      btn.textContent = '✋ Levantar Mão';
      btn.classList.remove('raised');
    }

    document.getElementById('raiseHandBtn').onclick = () => {
      if(_myHandRaised){ lowerHand(); } else { raiseHand(); }
    };

    document.getElementById('chatForm').onsubmit = (ev) => {
      ev.preventDefault();
      if(!ws || ws.readyState !== WebSocket.OPEN){ return; }
      const input = document.getElementById('chatInput');
      const message = input.value.trim();
      if(!message) return;
      const name = document.getElementById('chatNameInput').value.trim() || _chatName || 'Participante';
      sendMessage({type: 'chat', name, message});
      appendChatMessage(name, message, true);
      input.value = '';
    };

    function createRemoteVideoEl(peerId){
      const v = document.createElement('video');
      v.autoplay = true; v.playsInline = true; v.style.width = '45%'; v.style.margin = '1%'; v.id = 'remote_' + peerId;
      remoteContainer.appendChild(v);
      return v;
    }

    // Recording control now happens on backend/server

    async function requestServerRecordingStart(){
      if(!currentRoom){
        document.getElementById('recordStatus').textContent = 'Conecte-se à sala antes de iniciar gravação';
        return;
      }
      const res = await fetch(`${BACKEND_API_BASE}/recordings/server/start/`, {
        method:'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({room_name: currentRoom, started_by: clientId})
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || !data.ok){
        throw new Error(data.message || data.error || `HTTP ${res.status}`);
      }
      document.getElementById('recordStatus').textContent = 'Solicitação enviada: gravação no servidor iniciada';
    }

    async function requestServerRecordingStop(){
      if(!currentRoom){
        document.getElementById('recordStatus').textContent = 'Conecte-se à sala antes de parar gravação';
        return;
      }
      const res = await fetch(`${BACKEND_API_BASE}/recordings/server/stop/`, {
        method:'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({room_name: currentRoom, stopped_by: clientId})
      });
      const data = await res.json().catch(() => ({}));
      if(!res.ok || !data.ok){
        throw new Error(data.message || data.error || `HTTP ${res.status}`);
      }
      document.getElementById('recordStatus').textContent = 'Solicitação enviada: parada da gravação no servidor';
      if(currentRoom) startRecordingResultPolling(currentRoom);
    }

    document.getElementById('recordStartBtn').onclick = async () => {
      document.getElementById('recordStatus').textContent = '⏳ Solicitando início de gravação...';
      try{
        await requestServerRecordingStart();
      }catch(e){
        const msg = e.message || String(e);
        document.getElementById('recordStatus').textContent =
          '❌ Não foi possível iniciar gravação: ' + msg +
          (msg.includes('404') ? ' (endpoint de gravação server-side não encontrado)' : '');
      }
    };
    document.getElementById('recordStopBtn').onclick = async () => {
      document.getElementById('recordStatus').textContent = '⏳ Solicitando parada de gravação...';
      try{
        await requestServerRecordingStop();
      }catch(e){
        const msg = e.message || String(e);
        document.getElementById('recordStatus').textContent =
          '❌ Não foi possível parar gravação: ' + msg;
      }
    };
  </script>
</body>
</html>
